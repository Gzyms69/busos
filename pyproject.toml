[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "busos"
version = "9.5.0"
description = "National Transit Equity & Urban Gravity Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Dawid Czerwiński", email = "dawidekczerwinski@gmail.com" }
]
dependencies = [
    "pandas>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "fiona>=1.9",
    "pyproj>=3.5",
    "gtfs-kit",
    "openpyxl",
    "rtree",
    "pyogrio",
    "requests",
    "h3>=4.0",
    "lxml",
    "urllib3",
    "pyarrow",
    "fastparquet",
    "scikit-learn",
    "matplotlib",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "qdrant-client>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "jupyter"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "jupyter"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
exclude = ["data*", "cache*", "logs*", "config*", "reports*", "notebooks*", "urban-dashboard*", "tests*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
