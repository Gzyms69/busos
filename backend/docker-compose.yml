services:
  caddy:
    image: caddy:2-alpine
    container_name: busos-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - busos-api

  busos-api:
    build: .
    container_name: busos-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - BUSOS_DATA_DIR=/data/cities
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ../data/cities:/data/cities:ro
      - ../data/database:/data/database:ro
    depends_on:
      - qdrant


  qdrant:
    image: qdrant/qdrant:latest
    container_name: busos-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  caddy_data:
  caddy_config:
  qdrant_storage:
