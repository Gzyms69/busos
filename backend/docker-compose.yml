services:
  caddy:
    image: caddy:2-alpine
    container_name: busos-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - busos-api

  busos-api:
    build: .
    container_name: busos-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - BUSOS_DATA_DIR=/data/cities
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../data/cities:/data/cities:ro
      - ../data/database:/data/database:ro
    depends_on:
      - qdrant
      - redis

  redis:
    image: redis:7-alpine
    container_name: busos-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: busos-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: busos-victoriametrics
    restart: unless-stopped
    volumes:
      - ./monitoring/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
      - vmdata:/storage
    command:
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
      - "-storageDataPath=/storage"
      - "-retentionPeriod=14d"
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: busos-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - victoriametrics
    profiles: ["monitoring"]

volumes:
  caddy_data:
  caddy_config:
  qdrant_storage:
  redis_data:
  vmdata:
  grafana_data:
