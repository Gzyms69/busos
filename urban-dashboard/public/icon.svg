<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Rounded Squircle Container matching czerwinskidawid.pl -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#27272a" stroke-width="12" opacity="0.8"/>

  <!-- Stylized Modern Bus Silhouette -->
  <!-- Outer Body -->
  <rect x="136" y="112" width="240" height="288" rx="44" fill="url(#busGrad)"/>

  <!-- Top Windshield Glass -->
  <rect x="156" y="136" width="200" height="108" rx="24" fill="url(#windowGrad)"/>

  <!-- Route Display Indicator Bar -->
  <rect x="196" y="148" width="120" height="12" rx="6" fill="#3b82f6" opacity="0.9"/>

  <!-- Route Line / Grid Separator -->
  <rect x="156" y="264" width="200" height="6" rx="3" fill="#27272a"/>

  <!-- Lower Grille & Transit Node -->
  <rect x="196" y="292" width="120" height="40" rx="12" fill="#090a0f" stroke="#27272a" stroke-width="4"/>

  <!-- Headlights -->
  <circle cx="172" cy="312" r="14" fill="#ffffff"/>
  <circle cx="172" cy="312" r="8" fill="#e2e8f0"/>

  <circle cx="340" cy="312" r="14" fill="#ffffff"/>
  <circle cx="340" cy="312" r="8" fill="#e2e8f0"/>

  <!-- Wheels -->
  <rect x="156" y="388" width="40" height="18" rx="8" fill="#090a0f"/>
  <rect x="316" y="388" width="40" height="18" rx="8" fill="#090a0f"/>

  <!-- Connected Pulse Node (Active Cyber Green from czerwinskidawid.pl) -->
  <circle cx="256" cy="312" r="10" fill="#22c55e" filter="url(#glowGreen)"/>
  <circle cx="256" cy="312" r="5" fill="#ffffff"/>
</svg>
